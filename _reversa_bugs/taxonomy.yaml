# Vocabulário controlado do registro de bugs do harness.
# Semeado em 2026-08-11 a partir de _reversa_sdd/architecture.md e domain.md
# (camadas hexagonais do core, adapters de borda e superfícies instaladas).
# Propostas de termo novo: registrar em Agent Notes do bug e atualizar aqui via decisão.

area:
  - core                  # src/core (hexágono: serviços, domínio, ports)
  - adapters              # src/adapters (mcp, antigravity) e borda CLI (main.py)
  - skills-instaladas     # assets materializados nos projetos (.claude/skills, .agents/skills)
  - base-instalada        # projetos que consomem o harness (shim, harness.toml, artefatos .harness/)
  - ambiente-operacional  # camadas fora do repo que moldam o comportamento (memória por-projeto, hooks da IDE)

module:
  - session               # core/session (resume, close_flow, offers, serializer)
  - decisions             # core/decisions (índice, visão compacta, gate)
  - bootstrap             # core/bootstrap (init_service)
  - install               # core/install (materializadores, perfis, local_apply)
  - commands              # core/commands (CommandService)
  - progress              # core/progress (medidor, kanban)
  - domain                # core/domain (models, config)
  - cli                   # src/main.py
  - mcp                   # adapters/mcp/server.py
  - antigravity           # adapters/antigravity/hook_bridge.py e materializador de hooks
  - memoria-por-projeto   # memória do Claude Code por projeto (fora do repo)

feature:
  - encerramento-de-sessao
  - microdecisoes
  - resume
  - init
  - migrate
  - materializacao
  - medidor-de-progresso
  - kanban-derivado
