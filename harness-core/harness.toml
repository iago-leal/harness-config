# Configurações globais do Harness

[harness]
active_harness = "claude"     # claude | gemini | antigravity

[formatting]
exclude_paths = ["~/Notas", "~/.claude"]
opt_out_file = ".no-autoformat"

[sync]
cache_ttl_hours = 24
remote_check_enabled = true

[decisions]
dir = ".harness/decisoes"
index_file = ".harness/microdecisoes.md"
header_file = ".harness/decisoes/_cabecalho.md"
